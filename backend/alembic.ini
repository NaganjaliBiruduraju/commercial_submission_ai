# Alembic configuration file
# Reference: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# The sqlalchemy.url is overridden at runtime by alembic/env.py from
# app.core.config (reads DATABASE_URL from .env). The placeholder below
# is never actually used but is required by Alembic's config parser.
script_location = alembic
sqlalchemy.url = postgresql+asyncpg://placeholder/placeholder

# Prepend sys.path so alembic can import app modules
prepend_sys_path = .

# Template for new migration file names:
# <timestamp>_<slug>.py  (sortable by creation time)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template timestamps
timezone = UTC

# Migrations directory (relative to script_location)
version_locations = %(here)s/alembic/versions

# Max line length for generated migration files
truncate_slug_length = 40


# ---------------------------------------------------------------------------
# Logging — mirrors the application logging configuration
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
