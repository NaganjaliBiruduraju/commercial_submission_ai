version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: insight_ai_postgres
    environment:
      POSTGRES_USER: insight_user
      POSTGRES_PASSWORD: insight_pass
      POSTGRES_DB: insight_ai
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight_user -d insight_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insight_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insight_ai_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://insight_user:insight_pass@postgres:5432/insight_ai
      GROQ_API_KEY: ${GROQ_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - upload_data:/app/data/uploads
      - knowledge_data:/app/data/knowledge
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insight_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (React + TypeScript + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insight_ai_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - insight_network

  # Redis (for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: insight_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - insight_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local
  knowledge_data:
    driver: local
  redis_data:
    driver: local

networks:
  insight_network:
    driver: bridge
